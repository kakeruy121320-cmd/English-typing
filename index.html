<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カスタムタイピングゲーム</title>
  <style>
    @charset "UTF-8";

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      text-align: center;
      padding-top: 50px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .settings {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px dashed #eee;
    }

    .settings-row {
      margin-bottom: 15px;
    }

    .settings label, .settings input {
      font-size: 16px;
      margin: 0 5px;
    }

    select {
      font-size: 16px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #bdc3c7;
      cursor: pointer;
    }

    .settings input[type="text"].id-input {
      width: 80px;
      padding: 5px;
      text-align: center;
      border: 1px solid #bdc3c7;
      border-radius: 4px;
    }

    input[type="checkbox"] {
      transform: scale(1.2);
      margin-right: 8px;
      cursor: pointer;
    }

    .btn-group {
      margin-top: 10px;
    }

    button {
      background-color: #3498db;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin: 0 5px;
      transition: background-color 0.2s;
    }

    button:hover:not(:disabled) {
      background-color: #2980b9;
    }

    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    #stop-btn {
      background-color: #e74c3c;
    }
    #stop-btn:hover:not(:disabled) {
      background-color: #c0392b;
    }

    .game-area {
      min-height: 200px;
    }

    #timer-container {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px dashed #ecf0f1;
    }

    #best-time {
      font-size: 14px;
      color: #7f8c8d;
      margin-bottom: 5px;
      font-weight: bold;
    }

    #progress {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    #timer {
      font-size: 24px;
      font-weight: bold;
      color: #e67e22;
    }

    #display-text {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .word-container {
      font-size: 36px;
      letter-spacing: 3px;
      font-family: monospace;
      margin-bottom: 25px;
    }

    .typed {
      color: #27ae60;
      font-weight: bold;
    }

    .untyped {
      color: #bdc3c7;
    }

    #user-input {
      display: block;
      width: 80%;
      max-width: 400px;
      margin: 0 auto;
      padding: 15px;
      font-size: 24px;
      text-align: center;
      border: 2px solid #bdc3c7;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 15px;
    }

    #user-input:focus {
      border-color: #3498db;
      box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
    }

    #user-input:disabled {
      background-color: #ecf0f1;
      cursor: not-allowed;
    }

    #hint-btn {
      background-color: #f39c12;
      font-size: 14px;
      padding: 8px 16px;
      margin-top: 0;
    }
    #hint-btn:hover:not(:disabled) {
      background-color: #e67e22;
    }

    #message {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #e74c3c;
      height: 24px;
    }

    .hint {
      font-size: 12px;
      color: #7f8c8d;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>英和タイピング</h1>
    
    <div class="settings">
      <div class="settings-row">
        <label for="range-select">出題範囲：</label>
        <select id="range-select">
          <option value="h311">3年レッスン1 セクション1</option>
          <option value="h312">3年レッスン1 セクション2</option>
          <option value="h313">3年レッスン1 セクション3</option>
          <option value="h31">3年レッスン1</option>
          <option value="h321">3年レッスン2 セクション1</option>
          <option value="h322">3年レッスン2 セクション2</option>
          <option value="h323">3年レッスン2 セクション3</option>
          <option value="h32">3年レッスン2</option>
          <option value="h331">3年レッスン3 セクション1</option>
          <option value="h332">3年レッスン3 セクション2</option>
          <option value="h333">3年レッスン3 セクション3</option>
          <option value="h33">3年レッスン3</option>
          option value="h341">3年レッスン4 セクション1</option>
          <option value="h342">3年レッスン4 セクション2</option>
          <option value="h343">3年レッスン4 セクション3</option>
          <option value="h34">3年レッスン4</option>
          <option value="all">すべて出題</option>
          <option value="custom">IDで細かく指定する</option>
        </select>
      </div>

      <div class="settings-row" id="custom-range" style="display: none;">
        <label for="start-id">開始ID:</label>
        <input type="text" id="start-id" class="id-input" value="h31101">
        <span>〜</span>
        <label for="end-id">終了ID:</label>
        <input type="text" id="end-id" class="id-input" value="h33314">
      </div>
      
      <div class="settings-row">
        <label>
          <input type="checkbox" id="show-untyped">
          ガイド表示
        </label>
      </div>

      <div class="settings-row">
        <label>
          <input type="checkbox" id="swap-words">
          日本語入力
        </label>
      </div>

      <div class="btn-group">
        <button id="start-btn" disabled>データ読み込み中...</button>
        <button id="stop-btn" disabled>中断</button>
      </div>
    </div>

    <div class="game-area" id="game-area">
      <div id="timer-container">
        <div id="best-time">自己ベスト: 測定なし</div>
        <div id="progress">問題: - / -</div>
        <div id="timer">タイム: 0.0秒</div>
      </div>
      
      <div id="display-text">ここに問題が表示されます</div>
      <div class="word-container">
        <span id="typed" class="typed"></span><span id="untyped" class="untyped"></span>
      </div>
      
      <input type="text" id="user-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ここに入力..." disabled>
      
      <button id="hint-btn" disabled>💡 次の1文字</button>
      
      <div id="message">データを取得しています...</div>
      <div class="hint" id="hint-text" style="display: none;">　</div>
    </div>
  </div>

  <script>
    // =========================================================
    // ★ここを書き換える：スプレッドシートで発行したCSVのURLを貼り付けてください
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSbcRWsdF_Dmzqd46vlaZZ2KGVo7eSm1149VlN0dk0PIBkqecHcT0miTXWNFOr1cFTCfqSi3XWKWgJ_/pub?output=csv";
    // =========================================================

    let questions = []; // スプレッドシートから読み込んだデータを格納する配列
    
    let remainingQuestions = [];
    let currentQuestion = null; 
    let currentWordTarget = "";
    let currentTypedLength = 0;
    let isComposing = false; 
    let hintCount = 0;
    let totalQuestionsCount = 0; 

    let startTime;
    let timerInterval;

    const startBtn = document.getElementById("start-btn");
    const stopBtn = document.getElementById("stop-btn");
    const displayEl = document.getElementById("display-text");
    const typedEl = document.getElementById("typed");
    const untypedEl = document.getElementById("untyped");
    const messageEl = document.getElementById("message");
    const showUntypedCb = document.getElementById("show-untyped");
    const swapWordsCb = document.getElementById("swap-words");
    const userInput = document.getElementById("user-input");
    const hintBtn = document.getElementById("hint-btn");
    const hintText = document.getElementById("hint-text");
    const timerEl = document.getElementById("timer");
    const bestTimeEl = document.getElementById("best-time");
    const progressEl = document.getElementById("progress"); 
    const rangeSelect = document.getElementById("range-select");
    const customRangeDiv = document.getElementById("custom-range");

    // --- CSV読み込み処理 ---
    async function loadQuestionsFromCSV() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error("ネットワークエラー");
        const csvText = await response.text();
        
        parseCSV(csvText);
        
        startBtn.disabled = false;
        startBtn.textContent = "ゲームスタート";
        messageEl.textContent = "単語リストの読み込みが完了しました！";
        messageEl.style.color = "#27ae60";
        setTimeout(() => {
          if(messageEl.textContent === "単語リストの読み込みが完了しました！") messageEl.textContent = "";
        }, 3000);

      } catch (error) {
        console.error("CSV読み込み失敗:", error);
        messageEl.textContent = "データの読み込みに失敗しました。URLを確認してください。";
        messageEl.style.color = "#e74c3c";
        startBtn.textContent = "エラー発生";
      }
    }

    // CSVのテキストデータを配列に変換する関数
    function parseCSV(str) {
      const lines = str.split('\n');
      questions = [];

      for (let i = 0; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        
        let row = [];
        let current = '';
        let inQuotes = false;
        
        for (let j = 0; j < lines[i].length; j++) {
          let char = lines[i][j];
          if (char === '"' && lines[i][j+1] === '"') {
            current += '"';
            j++;
          } else if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(current);
            current = '';
          } else {
            current += char;
          }
        }
        row.push(current);
        
        // 空白と余分な改行コードを削除
        row = row.map(s => s.trim());
        
        let id = row[0];
        let display = row[1];
        let target = row[2];

        // ヘッダー行や空の行はスキップ
        if (!id || id.toUpperCase() === "ID" || !display || !target) continue;

        questions.push({ id: id, display: display, target: target });
      }
    }

    // 画面を開いたときに自動でデータを読み込む
    loadQuestionsFromCSV();

    function updateBestTimeDisplay() {
      const range = rangeSelect.value;
      if (range === "custom") {
        bestTimeEl.textContent = "自己ベスト: (カスタム範囲は記録されません)";
      } else {
        const record = localStorage.getItem("typing_record_" + range);
        if (record) {
          bestTimeEl.textContent = `自己ベスト: ${record}秒`;
        } else {
          bestTimeEl.textContent = "自己ベスト: 記録なし";
        }
      }
    }

    updateBestTimeDisplay();

    rangeSelect.addEventListener("change", () => {
      if (rangeSelect.value === "custom") {
        customRangeDiv.style.display = "block";
      } else {
        customRangeDiv.style.display = "none"; 
      }
      updateBestTimeDisplay();
    });

    showUntypedCb.addEventListener("change", updateWordDisplay);

    swapWordsCb.addEventListener("change", () => {
      if (currentQuestion) {
        setupCurrentQuestionDisplay();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === " " && userInput && !userInput.disabled) {
        const nextExpectedChar = currentWordTarget[currentTypedLength];
        if (nextExpectedChar !== " ") {
          e.preventDefault(); 
          showHint();
        }
      }
    });

    hintBtn.addEventListener("click", () => {
      showHint();
      if (userInput && !userInput.disabled) {
        userInput.focus();
      }
    });

    function showHint() {
      if (!currentWordTarget || currentTypedLength >= currentWordTarget.length) return;
      const remainingLength = currentWordTarget.length - currentTypedLength;
      
      if (hintCount < remainingLength) {
        hintCount++;
        updateWordDisplay();
      }
    }

    // --- ゲームスタート ---
    startBtn.addEventListener("click", () => {
      if (questions.length === 0) {
        messageEl.textContent = "単語データがありません。";
        return;
      }

      const selectedRange = rangeSelect.value;

      if (selectedRange === "all") {
        remainingQuestions = [...questions]; 
      } else if (selectedRange === "custom") {
        const startId = document.getElementById("start-id").value;
        const endId = document.getElementById("end-id").value;
        remainingQuestions = questions.filter(q => q.id >= startId && q.id <= endId);
      } else {
        remainingQuestions = questions.filter(q => q.id.startsWith(selectedRange));
      }

      if (remainingQuestions.length === 0) {
        messageEl.textContent = "指定された範囲に問題がありません。";
        messageEl.style.color = "#e74c3c";
        displayEl.textContent = "";
        typedEl.textContent = "";
        untypedEl.textContent = "";
        progressEl.textContent = "問題: - / -";
        userInput.disabled = true;
        hintBtn.disabled = true;
        stopBtn.disabled = true;
        clearInterval(timerInterval);
        timerEl.textContent = "タイム: 0.0秒";
        return;
      }

      totalQuestionsCount = remainingQuestions.length;

      messageEl.textContent = "タイピング開始！";
      messageEl.style.color = "#e74c3c";
      hintText.style.display = "block";
      
      startBtn.disabled = true;
      stopBtn.disabled = false;
      userInput.disabled = false;
      hintBtn.disabled = false;
      userInput.value = "";
      userInput.focus();
      
      clearInterval(timerInterval);
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const elapsedTime = (Date.now() - startTime) / 1000;
        timerEl.textContent = `タイム: ${elapsedTime.toFixed(1)}秒`;
      }, 100);

      setNextQuestion();
    });

    // --- ゲーム中断 ---
    stopBtn.addEventListener("click", () => {
      clearInterval(timerInterval);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      userInput.disabled = true;
      hintBtn.disabled = true;
      
      displayEl.textContent = "中断しました";
      typedEl.textContent = "";
      untypedEl.textContent = "";
      progressEl.textContent = "問題: - / -";
      messageEl.textContent = "";
      hintText.style.display = "none";
      
      currentQuestion = null;
      currentWordTarget = "";
      userInput.value = "";
    });

    function setNextQuestion() {
      if (remainingQuestions.length === 0) {
        progressEl.textContent = `問題: ${totalQuestionsCount} / ${totalQuestionsCount} (残り: 0単語)`;
        clearInterval(timerInterval);
        const finalTimeStr = ((Date.now() - startTime) / 1000).toFixed(1);
        const finalTimeNum = parseFloat(finalTimeStr);
        const selectedRange = rangeSelect.value;
        let isNewRecord = false;

        if (selectedRange !== "custom") {
          const savedRecord = localStorage.getItem("typing_record_" + selectedRange);
          if (!savedRecord || finalTimeNum < parseFloat(savedRecord)) {
            localStorage.setItem("typing_record_" + selectedRange, finalTimeStr);
            isNewRecord = true;
          }
        }
        
        displayEl.textContent = "全問クリア！";
        typedEl.textContent = "";
        untypedEl.textContent = "";
        
        if (isNewRecord) {
          messageEl.textContent = `お疲れ様でした！ クリアタイム: ${finalTimeStr}秒 【✨新記録✨】`;
        } else {
          messageEl.textContent = `お疲れ様でした！ クリアタイム: ${finalTimeStr}秒`;
        }
        messageEl.style.color = "#27ae60";
        
        hintText.style.display = "none";
        currentQuestion = null;
        currentWordTarget = ""; 
        userInput.value = "";
        userInput.disabled = true; 
        hintBtn.disabled = true;
        
        startBtn.disabled = false;
        stopBtn.disabled = true;
        
        updateBestTimeDisplay(); 
        return;
      }

      const currentQNum = totalQuestionsCount - remainingQuestions.length + 1;
      const remainingCount = remainingQuestions.length - 1;
      progressEl.textContent = `問題: ${currentQNum} / ${totalQuestionsCount} (残り: ${remainingCount}単語)`;

      messageEl.style.color = "#e74c3c";
      const randomIndex = Math.floor(Math.random() * remainingQuestions.length);
      currentQuestion = remainingQuestions.splice(randomIndex, 1)[0];

      setupCurrentQuestionDisplay();
    }

    function setupCurrentQuestionDisplay() {
      const isSwapped = swapWordsCb.checked;
      
      displayEl.textContent = isSwapped ? currentQuestion.target : currentQuestion.display;
      currentWordTarget = isSwapped ? currentQuestion.display : currentQuestion.target;
      
      currentTypedLength = 0;
      hintCount = 0; 
      userInput.value = "";
      updateWordDisplay();
    }

    function updateWordDisplay() {
      if (!currentWordTarget) return;

      typedEl.textContent = currentWordTarget.substring(0, currentTypedLength);
      
      if (showUntypedCb.checked) {
        untypedEl.textContent = currentWordTarget.substring(currentTypedLength);
      } else {
        untypedEl.textContent = currentWordTarget.substring(currentTypedLength, currentTypedLength + hintCount);
      }
    }

    userInput.addEventListener("compositionstart", () => {
      isComposing = true;
    });

    userInput.addEventListener("compositionend", () => {
      isComposing = false;
      handleInputValidation(); 
    });

    userInput.addEventListener("input", () => {
      if (!isComposing) {
        handleInputValidation();
      }
    });

    function handleInputValidation() {
      if (!currentWordTarget || currentTypedLength >= currentWordTarget.length) {
        userInput.value = currentWordTarget ? currentWordTarget.substring(0, currentTypedLength) : "";
        return;
      }

      const inputValue = userInput.value;

      if (currentWordTarget.startsWith(inputValue)) {
        currentTypedLength = inputValue.length;
        hintCount = 0; 
        updateWordDisplay();
        
        if (messageEl.textContent === "タイピング開始！") {
          messageEl.textContent = "";
        }

        if (currentTypedLength === currentWordTarget.length) {
          setTimeout(setNextQuestion, 200);
        }
      } else {
        userInput.value = currentWordTarget.substring(0, currentTypedLength);
      }
    }
  </script>
</body>
</html>
