<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カスタムタイピングゲーム</title>
  <style>
    @charset "UTF-8";

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      text-align: center;
      padding-top: 50px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .settings {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px dashed #eee;
    }

    .settings-row {
      margin-bottom: 15px;
    }

    .settings label, .settings input {
      font-size: 16px;
      margin: 0 5px;
    }

    select {
      font-size: 16px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #bdc3c7;
      cursor: pointer;
      margin: 0 4px;
    }

    select:disabled {
      background-color: #ecf0f1;
      cursor: not-allowed;
    }

    .settings input[type="text"].id-input {
      width: 80px;
      padding: 5px;
      text-align: center;
      border: 1px solid #bdc3c7;
      border-radius: 4px;
    }

    input[type="checkbox"] {
      transform: scale(1.2);
      margin-right: 8px;
      cursor: pointer;
    }

    .btn-group {
      margin-top: 10px;
    }

    button {
      background-color: #3498db;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      transition: background-color 0.2s;
    }

    button:hover:not(:disabled) {
      background-color: #2980b9;
    }

    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    #stop-btn {
      background-color: #e74c3c;
    }
    #stop-btn:hover:not(:disabled) {
      background-color: #c0392b;
    }

    /* 一覧ボタンのスタイル */
    #toggle-list-btn {
      background-color: #9b59b6;
      display: block;
      margin: 15px auto 0 auto;
      width: 80%;
      max-width: 300px;
    }
    #toggle-list-btn:hover:not(:disabled) {
      background-color: #8e44ad;
    }

    .game-area {
      min-height: 200px;
    }

    #timer-container {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px dashed #ecf0f1;
    }

    #best-time {
      font-size: 14px;
      color: #7f8c8d;
      margin-bottom: 5px;
      font-weight: bold;
    }

    #progress {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    #timer {
      font-size: 24px;
      font-weight: bold;
      color: #e67e22;
    }

    #display-text {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .word-container {
      font-size: 36px;
      letter-spacing: 3px;
      font-family: monospace;
      margin-bottom: 25px;
    }

    .typed {
      color: #27ae60;
      font-weight: bold;
    }

    .untyped {
      color: #bdc3c7;
    }

    #user-input {
      display: block;
      width: 80%;
      max-width: 400px;
      margin: 0 auto;
      padding: 15px;
      font-size: 24px;
      text-align: center;
      border: 2px solid #bdc3c7;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 15px;
    }

    #user-input:focus {
      border-color: #3498db;
      box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
    }

    #user-input:disabled {
      background-color: #ecf0f1;
      cursor: not-allowed;
    }

    #hint-btn {
      background-color: #f39c12;
      font-size: 14px;
      padding: 8px 16px;
      margin-top: 0;
    }
    #hint-btn:hover:not(:disabled) {
      background-color: #e67e22;
    }

    #message {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #e74c3c;
      height: 24px;
    }

    .hint {
      font-size: 12px;
      color: #7f8c8d;
      margin-top: 10px;
    }

    /* 単語一覧エリアのスタイル */
    #word-list-container {
      margin-top: 30px;
      padding: 20px;
      background: #fdfdfd;
      border-radius: 12px;
      border: 2px solid #ecf0f1;
      text-align: left;
    }
    #word-list-container h2 {
      text-align: center;
      color: #2c3e50;
      border-bottom: 2px solid #9b59b6;
      padding-bottom: 10px;
      margin-top: 0;
    }
    #word-list-container h3 {
      color: #34495e;
      margin-top: 25px;
      margin-bottom: 10px;
      border-left: 5px solid #3498db;
      padding-left: 10px;
    }
    .word-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 16px;
    }
    .word-table th, .word-table td {
      border: 1px solid #bdc3c7;
      padding: 10px 12px;
    }
    .word-table th {
      background-color: #ecf0f1;
      color: #2c3e50;
      width: 50%;
    }
    .word-table tr:nth-child(even) {
      background-color: #f9fbfb;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>英和タイピング</h1>
    
    <div class="settings">
      <div class="settings-row">
        <label>出題範囲：</label>
        <select id="unit-select">
          <!-- ユニットはスプレッドシートのIDから自動生成されます -->
        </select>

        <select id="section-select">
          <!-- セクションは選択中のユニットに応じて自動生成されます -->
        </select>
      </div>

      <div class="settings-row" id="custom-range" style="display: none;">
        <label for="start-id">開始ID:</label>
        <input type="text" id="start-id" class="id-input" value="h31101">
        <span>〜</span>
        <label for="end-id">終了ID:</label>
        <input type="text" id="end-id" class="id-input" value="h33314">
      </div>
      
      <div class="settings-row">
        <label>
          <input type="checkbox" id="show-untyped">
          ガイド表示
        </label>
      </div>

      <div class="settings-row">
        <label>
          <input type="checkbox" id="swap-words">
          日本語入力
        </label>
      </div>

      <div class="btn-group">
        <button id="start-btn" disabled>データ読み込み中...</button>
        <button id="stop-btn" disabled>中断</button>
      </div>
      
      <button id="toggle-list-btn" disabled>📖 単語一覧を見る</button>
    </div>

    <div id="word-list-container" style="display: none;"></div>

    <div class="game-area" id="game-area">
      <div id="timer-container">
        <div id="best-time">自己ベスト: 測定なし</div>
        <div id="progress">問題: - / -</div>
        <div id="timer">タイム: 0.0秒</div>
      </div>
      
      <div id="display-text">ここに問題が表示されます</div>
      <div class="word-container">
        <span id="typed" class="typed"></span><span id="untyped" class="untyped"></span>
      </div>
      
      <input type="text" id="user-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ここに入力..." disabled>
      
      <button id="hint-btn" disabled>💡 次の1文字</button>
      
      <div id="message">データを取得しています...</div>
      <div class="hint" id="hint-text" style="display: none;">　</div>
    </div>
  </div>

  <script>
    // URLの最後の改行を削除して1行に修正しました
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSbcRWsdF_Dmzqd46vlaZZ2KGVo7eSm1149VlN0dk0PIBkqecHcT0miTXWNFOr1cFTCfqSi3XWKWgJ_/pub?output=csv";

    let questions = []; 
    let unitSectionMap = {}; // { "1": Set("1","2","3"), "2": Set(...), ... }
    
    let remainingQuestions = [];
    let currentQuestion = null; 
    let currentWordTarget = "";
    let currentTypedLength = 0;
    let isComposing = false; 
    let hintCount = 0;
    let totalQuestionsCount = 0; 

    let startTime;
    let timerInterval;

    // 中断・再開用の状態
    let isPaused = false;
    let pausedElapsedMs = 0;

    const startBtn = document.getElementById("start-btn");
    const stopBtn = document.getElementById("stop-btn");
    const toggleListBtn = document.getElementById("toggle-list-btn");
    const wordListContainer = document.getElementById("word-list-container");
    const gameArea = document.getElementById("game-area");
    
    const displayEl = document.getElementById("display-text");
    const typedEl = document.getElementById("typed");
    const untypedEl = document.getElementById("untyped");
    const messageEl = document.getElementById("message");
    const showUntypedCb = document.getElementById("show-untyped");
    const swapWordsCb = document.getElementById("swap-words");
    const userInput = document.getElementById("user-input");
    const hintBtn = document.getElementById("hint-btn");
    const hintText = document.getElementById("hint-text");
    const timerEl = document.getElementById("timer");
    const bestTimeEl = document.getElementById("best-time");
    const progressEl = document.getElementById("progress"); 
    
    // UI部品を取得
    const unitSelect = document.getElementById("unit-select");
    const sectionSelect = document.getElementById("section-select");
    const customRangeDiv = document.getElementById("custom-range");

    // --- CSV読み込み処理 ---
    async function loadQuestionsFromCSV() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error("ネットワークエラー");
        const csvText = await response.text();
        
        parseCSV(csvText);
        buildUnitSectionOptions();
        
        startBtn.disabled = false;
        toggleListBtn.disabled = false;
        startBtn.textContent = "ゲームスタート";
        messageEl.textContent = "単語リストの読み込みが完了しました！";
        messageEl.style.color = "#27ae60";
        setTimeout(() => {
          if(messageEl.textContent === "単語リストの読み込みが完了しました！") messageEl.textContent = "";
        }, 3000);

      } catch (error) {
        console.error("CSV読み込み失敗:", error);
        messageEl.textContent = "データの読み込みに失敗しました。URLを確認してください。";
        messageEl.style.color = "#e74c3c";
        startBtn.textContent = "エラー発生";
      }
    }

    // CSVのテキストデータを配列に変換する関数
    function parseCSV(str) {
      const lines = str.split('\n');
      questions = [];

      for (let i = 0; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        
        let row = [];
        let current = '';
        let inQuotes = false;
        
        for (let j = 0; j < lines[i].length; j++) {
          let char = lines[i][j];
          if (char === '"' && lines[i][j+1] === '"') {
            current += '"';
            j++;
          } else if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(current);
            current = '';
          } else {
            current += char;
          }
        }
        row.push(current);
        
        row = row.map(s => s.trim());
        
        let id = row[0];
        let display = row[1];
        let target = row[2];

        if (!id || id.toUpperCase() === "ID" || !display || !target) continue;

        questions.push({ id: id, display: display, target: target });
      }
    }

    // IDから「h3<ユニット><セクション>...」を読み取り、ユニット/セクションの一覧を自動構築する
    function buildUnitSectionOptions() {
      unitSectionMap = {};

      questions.forEach(q => {
        const m = q.id.match(/^h3(\d)(\d)/i);
        if (!m) return;
        const unit = m[1];
        const section = m[2];
        if (!unitSectionMap[unit]) unitSectionMap[unit] = new Set();
        unitSectionMap[unit].add(section);
      });

      const units = Object.keys(unitSectionMap).sort((a, b) => Number(a) - Number(b));

      unitSelect.innerHTML = "";
      units.forEach(u => {
        const opt = document.createElement("option");
        opt.value = u;
        opt.textContent = `3年 ユニット${u}`;
        unitSelect.appendChild(opt);
      });

      const optAll = document.createElement("option");
      optAll.value = "all";
      optAll.textContent = "すべて出題";
      unitSelect.appendChild(optAll);

      const optCustom = document.createElement("option");
      optCustom.value = "custom";
      optCustom.textContent = "IDで細かく指定する";
      unitSelect.appendChild(optCustom);

      updateSectionOptions();
    }

    // 選択中のユニットに応じて、実際に存在するセクションだけを選択肢として構築する
    function updateSectionOptions() {
      const unit = unitSelect.value;
      const previousValue = sectionSelect.value;
      sectionSelect.innerHTML = "";

      const optAll = document.createElement("option");
      optAll.value = "all";
      optAll.textContent = "すべてのセクション";
      sectionSelect.appendChild(optAll);

      if (unitSectionMap[unit]) {
        const sections = Array.from(unitSectionMap[unit]).sort((a, b) => Number(a) - Number(b));
        sections.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = `セクション ${s}`;
          sectionSelect.appendChild(opt);
        });

        // 以前選んでいたセクションが新しいユニットにも存在するなら維持する
        if (sections.includes(previousValue)) {
          sectionSelect.value = previousValue;
        }
      }
    }

    loadQuestionsFromCSV();

    // 2つのプルダウンから現在のモード（接頭辞）を計算する関数
    function getCurrentRangeValue() {
      const unit = unitSelect.value;
      if (unit === "all") return "all";
      if (unit === "custom") return "custom";
      
      const sec = sectionSelect.value;
      if (sec === "all") return `h3${unit}`;
      return `h3${unit}${sec}`;
    }

    // 画面の表示切り替えとベストタイムの更新
    function updateUI() {
      const unit = unitSelect.value;
      
      if (unit === "all") {
        customRangeDiv.style.display = "none";
        sectionSelect.disabled = true;
      } else if (unit === "custom") {
        customRangeDiv.style.display = "block";
        sectionSelect.disabled = true;
      } else {
        customRangeDiv.style.display = "none";
        sectionSelect.disabled = false;
      }

      const range = getCurrentRangeValue();
      if (range === "custom") {
        bestTimeEl.textContent = "自己ベスト: (カスタム範囲は記録されません)";
      } else {
        const record = localStorage.getItem("typing_record_" + range);
        if (record) {
          bestTimeEl.textContent = `自己ベスト: ${record}秒`;
        } else {
          bestTimeEl.textContent = "自己ベスト: 記録なし";
        }
      }
    }

    // 出題範囲を変更したら、進行中の中断状態はリセットする（別範囲になるため再開は無効）
    function cancelPauseIfNeeded() {
      if (!isPaused) return;
      isPaused = false;
      pausedElapsedMs = 0;
      startBtn.textContent = "ゲームスタート";
      remainingQuestions = [];
      currentQuestion = null;
      currentWordTarget = "";
      displayEl.textContent = "ここに問題が表示されます";
      typedEl.textContent = "";
      untypedEl.textContent = "";
      progressEl.textContent = "問題: - / -";
      timerEl.textContent = "タイム: 0.0秒";
      messageEl.textContent = "";
      hintText.style.display = "none";
      userInput.disabled = true;
      hintBtn.disabled = true;
      stopBtn.disabled = true;
    }

    unitSelect.addEventListener("change", () => {
      cancelPauseIfNeeded();
      updateSectionOptions();
      updateUI();
    });
    sectionSelect.addEventListener("change", () => {
      cancelPauseIfNeeded();
      updateUI();
    });

    showUntypedCb.addEventListener("change", updateWordDisplay);
    swapWordsCb.addEventListener("change", () => {
      if (currentQuestion) setupCurrentQuestionDisplay();
    });

    // --- 単語一覧の生成と表示切り替え ---
    toggleListBtn.addEventListener("click", () => {
      if (wordListContainer.style.display === "block") {
        // 閉じる
        wordListContainer.style.display = "none";
        gameArea.style.display = "block";
        toggleListBtn.textContent = "📖 単語一覧を見る";
      } else {
        // 開く（一覧を生成して表示）
        generateWordList();
        wordListContainer.style.display = "block";
        gameArea.style.display = "none";
        toggleListBtn.textContent = "✖ 一覧を閉じてゲームに戻る";
      }
    });

    function generateWordList() {
      if (questions.length === 0) {
        wordListContainer.innerHTML = "<p>データがありません。</p>";
        return;
      }

      // IDの先頭4文字（例: h311）ごとにグループ分けする
      const grouped = {};
      questions.forEach(q => {
        let prefix = q.id.substring(0, 4);
        if (!/^h3\d\d$/.test(prefix)) {
          prefix = "other";
        }
        if (!grouped[prefix]) {
          grouped[prefix] = [];
        }
        grouped[prefix].push(q);
      });

      let html = "<h2>登録されている単語一覧</h2>";
      const keys = Object.keys(grouped).sort();

      keys.forEach(key => {
        let title = "その他・カスタムID";
        if (key !== "other" && key.length === 4) {
          const u = key.charAt(2);
          const s = key.charAt(3);
          title = `3年 ユニット${u} セクション${s}`;
        }
        
        html += `<h3>${title}</h3>`;
        html += `<table class="word-table">
                   <tr><th>英語</th><th>日本語</th></tr>`;
        
        grouped[key].forEach(q => {
          html += `<tr><td>${q.target}</td><td>${q.display}</td></tr>`;
        });
        html += `</table>`;
      });

      wordListContainer.innerHTML = html;
    }

    // スペースキーでヒント
    document.addEventListener("keydown", (e) => {
      if (e.key === " " && userInput && !userInput.disabled) {
        const nextExpectedChar = currentWordTarget[currentTypedLength];
        if (nextExpectedChar !== " ") {
          e.preventDefault(); 
          showHint();
        }
      }
    });

    hintBtn.addEventListener("click", () => {
      showHint();
      if (userInput && !userInput.disabled) {
        userInput.focus();
      }
    });

    function showHint() {
      if (!currentWordTarget || currentTypedLength >= currentWordTarget.length) return;
      const remainingLength = currentWordTarget.length - currentTypedLength;
      
      if (hintCount < remainingLength) {
        hintCount++;
        updateWordDisplay();
      }
    }

    // --- ゲームスタート（または再開） ---
    startBtn.addEventListener("click", () => {
      if (isPaused) {
        resumeGame();
        return;
      }

      if (questions.length === 0) {
        messageEl.textContent = "単語データがありません。";
        return;
      }
      
      // 一覧が開いていたら強制的に閉じる
      wordListContainer.style.display = "none";
      gameArea.style.display = "block";
      toggleListBtn.textContent = "📖 単語一覧を見る";

      const selectedRange = getCurrentRangeValue();

      if (selectedRange === "all") {
        remainingQuestions = [...questions]; 
      } else if (selectedRange === "custom") {
        const startId = document.getElementById("start-id").value;
        const endId = document.getElementById("end-id").value;
        remainingQuestions = questions.filter(q => q.id >= startId && q.id <= endId);
      } else {
        remainingQuestions = questions.filter(q => q.id.startsWith(selectedRange));
      }

      if (remainingQuestions.length === 0) {
        messageEl.textContent = "指定された範囲に問題がありません。";
        messageEl.style.color = "#e74c3c";
        displayEl.textContent = "";
        typedEl.textContent = "";
        untypedEl.textContent = "";
        progressEl.textContent = "問題: - / -";
        userInput.disabled = true;
        hintBtn.disabled = true;
        stopBtn.disabled = true;
        clearInterval(timerInterval);
        timerEl.textContent = "タイム: 0.0秒";
        return;
      }

      totalQuestionsCount = remainingQuestions.length;

      messageEl.textContent = "タイピング開始！";
      messageEl.style.color = "#e74c3c";
      hintText.style.display = "block";
      
      startBtn.disabled = true;
      startBtn.textContent = "ゲームスタート";
      stopBtn.disabled = false;
      toggleListBtn.disabled = true; // プレイ中は一覧ボタンを無効化
      userInput.disabled = false;
      hintBtn.disabled = false;
      userInput.value = "";
      userInput.focus();
      
      isPaused = false;
      pausedElapsedMs = 0;
      clearInterval(timerInterval);
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const elapsedTime = (Date.now() - startTime) / 1000;
        timerEl.textContent = `タイム: ${elapsedTime.toFixed(1)}秒`;
      }, 100);

      setNextQuestion();
    });

    // --- ゲーム中断（状態は保持し、再開できるようにする） ---
    stopBtn.addEventListener("click", () => {
      pausedElapsedMs = Date.now() - startTime;
      clearInterval(timerInterval);
      isPaused = true;

      startBtn.disabled = false;
      startBtn.textContent = "再開する";
      stopBtn.disabled = true;
      toggleListBtn.disabled = false;
      userInput.disabled = true;
      hintBtn.disabled = true;

      messageEl.textContent = "中断しました（「再開する」で続きから始められます）";
      messageEl.style.color = "#e67e22";

      // currentQuestion / remainingQuestions / currentTypedLength はそのまま保持する
    });

    // --- ゲーム再開（中断した地点から続ける） ---
    function resumeGame() {
      isPaused = false;
      startBtn.disabled = true;
      startBtn.textContent = "ゲームスタート";
      stopBtn.disabled = false;
      toggleListBtn.disabled = true;
      userInput.disabled = false;
      hintBtn.disabled = false;
      userInput.value = currentWordTarget ? currentWordTarget.substring(0, currentTypedLength) : "";
      userInput.focus();

      messageEl.textContent = "再開しました！";
      messageEl.style.color = "#e74c3c";

      startTime = Date.now() - pausedElapsedMs;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsedTime = (Date.now() - startTime) / 1000;
        timerEl.textContent = `タイム: ${elapsedTime.toFixed(1)}秒`;
      }, 100);
    }

    function setNextQuestion() {
      if (remainingQuestions.length === 0) {
        progressEl.textContent = `問題: ${totalQuestionsCount} / ${totalQuestionsCount} (残り: 0単語)`;
        clearInterval(timerInterval);
        const finalTimeStr = ((Date.now() - startTime) / 1000).toFixed(1);
        const finalTimeNum = parseFloat(finalTimeStr);
        const selectedRange = getCurrentRangeValue();
        const guideIsOn = showUntypedCb.checked;
        let isNewRecord = false;

        // ガイド表示がオフの時だけ記録を反映する
        if (selectedRange !== "custom" && !guideIsOn) {
          const savedRecord = localStorage.getItem("typing_record_" + selectedRange);
          if (!savedRecord || finalTimeNum < parseFloat(savedRecord)) {
            localStorage.setItem("typing_record_" + selectedRange, finalTimeStr);
            isNewRecord = true;
          }
        }
        
        displayEl.textContent = "全問クリア！";
        typedEl.textContent = "";
        untypedEl.textContent = "";
        
        if (isNewRecord) {
          messageEl.textContent = `お疲れ様でした！ クリアタイム: ${finalTimeStr}秒 【✨新記録✨】`;
        } else if (guideIsOn) {
          messageEl.textContent = `お疲れ様でした！ クリアタイム: ${finalTimeStr}秒 （ガイド表示中は記録されません）`;
        } else {
          messageEl.textContent = `お疲れ様でした！ クリアタイム: ${finalTimeStr}秒`;
        }
        messageEl.style.color = "#27ae60";
        
        hintText.style.display = "none";
        currentQuestion = null;
        currentWordTarget = ""; 
        userInput.value = "";
        userInput.disabled = true; 
        hintBtn.disabled = true;
        
        isPaused = false;
        pausedElapsedMs = 0;
        startBtn.disabled = false;
        startBtn.textContent = "ゲームスタート";
        stopBtn.disabled = true;
        toggleListBtn.disabled = false;
        
        updateUI(); 
        return;
      }

      const currentQNum = totalQuestionsCount - remainingQuestions.length + 1;
      const remainingCount = remainingQuestions.length - 1;
      progressEl.textContent = `問題: ${currentQNum} / ${totalQuestionsCount} (残り: ${remainingCount}単語)`;

      messageEl.style.color = "#e74c3c";
      const randomIndex = Math.floor(Math.random() * remainingQuestions.length);
      currentQuestion = remainingQuestions.splice(randomIndex, 1)[0];

      setupCurrentQuestionDisplay();
    }

    function setupCurrentQuestionDisplay() {
      const isSwapped = swapWordsCb.checked;
      
      displayEl.textContent = isSwapped ? currentQuestion.target : currentQuestion.display;
      currentWordTarget = isSwapped ? currentQuestion.display : currentQuestion.target;
      
      currentTypedLength = 0;
      hintCount = 0; 
      userInput.value = "";
      updateWordDisplay();
    }

    function updateWordDisplay() {
      if (!currentWordTarget) return;

      typedEl.textContent = currentWordTarget.substring(0, currentTypedLength);
      
      if (showUntypedCb.checked) {
        untypedEl.textContent = currentWordTarget.substring(currentTypedLength);
      } else {
        untypedEl.textContent = currentWordTarget.substring(currentTypedLength, currentTypedLength + hintCount);
      }
    }

    userInput.addEventListener("compositionstart", () => {
      isComposing = true;
    });

    userInput.addEventListener("compositionend", () => {
      isComposing = false;
      handleInputValidation(); 
    });

    userInput.addEventListener("input", () => {
      if (!isComposing) {
        handleInputValidation();
      }
    });

    function handleInputValidation() {
      if (!currentWordTarget || currentTypedLength >= currentWordTarget.length) {
        userInput.value = currentWordTarget ? currentWordTarget.substring(0, currentTypedLength) : "";
        return;
      }

      const inputValue = userInput.value;

      if (currentWordTarget.startsWith(inputValue)) {
        currentTypedLength = inputValue.length;
        hintCount = 0; 
        updateWordDisplay();
        
        if (messageEl.textContent === "タイピング開始！") {
          messageEl.textContent = "";
        }

        if (currentTypedLength === currentWordTarget.length) {
          setTimeout(setNextQuestion, 200);
        }
      } else {
        userInput.value = currentWordTarget.substring(0, currentTypedLength);
      }
    }
  </script>
</body>
</html>
