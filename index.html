<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カスタムタイピング＆スピーキングゲーム</title>
  <style>
    @charset "UTF-8";

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      text-align: center;
      padding-top: 50px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .settings {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px dashed #eee;
    }

    .settings-row {
      margin-bottom: 15px;
    }

    .settings label, .settings input {
      font-size: 16px;
      margin: 0 5px;
    }

    select {
      font-size: 16px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #bdc3c7;
      cursor: pointer;
      margin: 0 4px;
    }

    select:disabled {
      background-color: #ecf0f1;
      cursor: not-allowed;
    }

    .settings input[type="text"].id-input {
      width: 80px;
      padding: 5px;
      text-align: center;
      border: 1px solid #bdc3c7;
      border-radius: 4px;
    }

    input[type="checkbox"] {
      transform: scale(1.2);
      margin-right: 8px;
      cursor: pointer;
    }

    .btn-group {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background-color: #3498db;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover:not(:disabled) {
      background-color: #2980b9;
    }

    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    #stop-btn { background-color: #95a5a6; }
    #stop-btn:hover:not(:disabled) { background-color: #7f8c8d; }

    /* 中断メニューの3つのボタン */
    #resume-btn { background-color: #27ae60; }
    #resume-btn:hover:not(:disabled) { background-color: #219a52; }
    #restart-btn { background-color: #f39c12; }
    #restart-btn:hover:not(:disabled) { background-color: #e67e22; }
    #quit-btn { background-color: #e74c3c; }
    #quit-btn:hover:not(:disabled) { background-color: #c0392b; }

    #toggle-list-btn {
      background-color: #9b59b6;
      display: block;
      margin: 15px auto 0 auto;
      width: 80%;
      max-width: 300px;
    }
    #toggle-list-btn:hover:not(:disabled) {
      background-color: #8e44ad;
    }

    .game-area {
      min-height: 200px;
    }

    #timer-container {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px dashed #ecf0f1;
    }

    #best-time {
      font-size: 14px;
      color: #7f8c8d;
      margin-bottom: 5px;
      font-weight: bold;
    }

    #progress {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    #timer {
      font-size: 24px;
      font-weight: bold;
      color: #e67e22;
    }

    #display-text {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .word-container {
      font-size: 36px;
      letter-spacing: 3px;
      font-family: monospace;
      margin-bottom: 25px;
    }

    .typed {
      color: #27ae60;
      font-weight: bold;
    }

    .untyped {
      color: #bdc3c7;
    }

    #user-input {
      display: block;
      width: 80%;
      max-width: 400px;
      margin: 0 auto;
      padding: 15px;
      font-size: 24px;
      text-align: center;
      border: 2px solid #bdc3c7;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 10px;
    }

    #user-input:focus {
      border-color: #3498db;
      box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
    }

    #user-input:disabled {
      background-color: #ecf0f1;
      cursor: not-allowed;
    }

    /* 音声入力ボタン */
    #voice-btn {
      background-color: #1abc9c;
      font-size: 16px;
      padding: 10px 20px;
      margin: 5px;
    }
    #voice-btn:hover:not(:disabled) {
      background-color: #16a085;
    }
    #voice-btn.listening {
      background-color: #e74c3c;
      animation: pulse 1.2s infinite;
    }
    #voice-btn.listening:hover:not(:disabled) {
      background-color: #c0392b;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(231,76,60,0.5); }
      70%  { box-shadow: 0 0 0 10px rgba(231,76,60,0); }
      100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); }
    }

    /* 音声認識ステータス表示 */
    #voice-status {
      min-height: 32px;
      margin: 6px auto 4px;
      font-size: 15px;
      color: #7f8c8d;
      font-style: italic;
    }

    /* 音声認識の暫定テキスト */
    #voice-interim {
      color: #3498db;
      font-size: 20px;
      font-weight: bold;
      min-height: 28px;
      margin: 4px 0;
    }

    /* ○×フラッシュ */
    #voice-result-flash {
      font-size: 48px;
      min-height: 56px;
      margin: 0;
      transition: opacity 0.4s;
    }

    #hint-btn {
      background-color: #f39c12;
      font-size: 14px;
      padding: 8px 16px;
      margin-top: 0;
    }
    #hint-btn:hover:not(:disabled) {
      background-color: #e67e22;
    }

    #message {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #e74c3c;
      height: 24px;
    }

    .hint {
      font-size: 12px;
      color: #7f8c8d;
      margin-top: 10px;
    }

    #word-list-container {
      margin-top: 30px;
      padding: 20px;
      background: #fdfdfd;
      border-radius: 12px;
      border: 2px solid #ecf0f1;
      text-align: left;
    }
    #word-list-container h2 {
      text-align: center;
      color: #2c3e50;
      border-bottom: 2px solid #9b59b6;
      padding-bottom: 10px;
      margin-top: 0;
    }
    #word-list-container h3 {
      color: #34495e;
      margin-top: 25px;
      margin-bottom: 10px;
      border-left: 5px solid #3498db;
      padding-left: 10px;
    }
    .word-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 16px;
    }
    .word-table th, .word-table td {
      border: 1px solid #bdc3c7;
      padding: 10px 12px;
    }
    .word-table th {
      background-color: #ecf0f1;
      color: #2c3e50;
      width: 50%;
    }
    .word-table tr:nth-child(even) {
      background-color: #f9fbfb;
    }

    /* 音声モード時は入力欄をうっすら表示 */
    #user-input.voice-mode {
      border-color: #1abc9c;
      background-color: #f0fdf9;
      color: #7f8c8d;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>英和タイピング</h1>
    
    <div class="settings">
      <div class="settings-row">
        <label>出題範囲：</label>
        <select id="unit-select"></select>
        <select id="section-select"></select>
      </div>

      <div class="settings-row" id="custom-range" style="display: none;">
        <label for="start-id">開始ID:</label>
        <input type="text" id="start-id" class="id-input" value="h31101">
        <span>〜</span>
        <label for="end-id">終了ID:</label>
        <input type="text" id="end-id" class="id-input" value="h33314">
      </div>
      
      <div class="settings-row">
        <label>
          <input type="checkbox" id="show-untyped">
          ガイド表示
        </label>
      </div>

      <div class="settings-row">
        <label>
          <input type="checkbox" id="swap-words">
          日本語入力
        </label>
      </div>

      <!-- 通常時のボタングループ -->
      <div class="btn-group" id="main-btn-group">
        <button id="start-btn" disabled>データ読み込み中...</button>
        <button id="stop-btn" disabled>⏸ 中断</button>
      </div>

      <!-- 中断メニュー時のボタングループ -->
      <div class="btn-group" id="pause-btn-group" style="display: none;">
        <button id="resume-btn">▶ 再開する</button>
        <button id="restart-btn">🔄 やり直す</button>
        <button id="quit-btn">⏹ やめる</button>
      </div>
      
      <button id="toggle-list-btn" disabled>📖 単語一覧を見る</button>
    </div>

    <div id="word-list-container" style="display: none;"></div>

    <div class="game-area" id="game-area">
      <div id="timer-container">
        <div id="best-time">自己ベスト: 測定なし</div>
        <div id="progress">問題: - / -</div>
        <div id="timer">タイム: 0.0秒</div>
      </div>
      
      <div id="display-text">ここに問題が表示されます</div>
      <div class="word-container">
        <span id="typed" class="typed"></span><span id="untyped" class="untyped"></span>
      </div>

      <!-- 音声入力エリア -->
      <button id="voice-btn" disabled>🎤 音声入力 OFF</button>
      <div id="voice-status"></div>
      <div id="voice-interim"></div>
      <div id="voice-result-flash"></div>

      <input type="text" id="user-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ここに入力..." disabled>
      
      <button id="hint-btn" disabled>💡 次の1文字</button>
      
      <div id="message">データを取得しています...</div>
      <div class="hint" id="hint-text" style="display: none;"> </div>
    </div>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSbcRWsdF_Dmzqd46vlaZZ2KGVo7eSm1149VlN0dk0PIBkqecHcT0miTXWNFOr1cFTCfqSi3XWKWgJ_/pub?output=csv";

    let questions = [];
    let unitSectionMap = {};
    
    // セッション管理
    let initialSessionQuestions = []; 
    let remainingQuestions = [];
    
    let currentQuestion = null;
    let currentWordTarget = "";
    let currentTypedLength = 0;
    let isComposing = false;
    let hintCount = 0;
    let totalQuestionsCount = 0;
    
    let startTime;
    let endTime = null; 
    let timerInterval;
    
    let isPaused = false;
    let pausedElapsedMs = 0;

    // ---- 音声認識 ----
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let voiceMode = false;          
    let voiceAnswered = false;      
    let voiceRestartTimer = null;   

    // DOM
    const mainBtnGroup   = document.getElementById("main-btn-group");
    const pauseBtnGroup  = document.getElementById("pause-btn-group");
    const startBtn       = document.getElementById("start-btn");
    const stopBtn        = document.getElementById("stop-btn");
    const resumeBtn      = document.getElementById("resume-btn");
    const restartBtn     = document.getElementById("restart-btn");
    const quitBtn        = document.getElementById("quit-btn");
    
    const toggleListBtn  = document.getElementById("toggle-list-btn");
    const wordListContainer = document.getElementById("word-list-container");
    const gameArea       = document.getElementById("game-area");
    const displayEl      = document.getElementById("display-text");
    const typedEl        = document.getElementById("typed");
    const untypedEl      = document.getElementById("untyped");
    const messageEl      = document.getElementById("message");
    const showUntypedCb  = document.getElementById("show-untyped");
    const swapWordsCb    = document.getElementById("swap-words");
    const userInput      = document.getElementById("user-input");
    const hintBtn        = document.getElementById("hint-btn");
    const hintText       = document.getElementById("hint-text");
    const timerEl        = document.getElementById("timer");
    const bestTimeEl     = document.getElementById("best-time");
    const progressEl     = document.getElementById("progress");
    const unitSelect     = document.getElementById("unit-select");
    const sectionSelect  = document.getElementById("section-select");
    const customRangeDiv = document.getElementById("custom-range");
    const voiceBtn       = document.getElementById("voice-btn");
    const voiceStatus    = document.getElementById("voice-status");
    const voiceInterim   = document.getElementById("voice-interim");
    const voiceFlash     = document.getElementById("voice-result-flash");

    // ==============================
    // 音声認識セットアップ
    // ==============================
    function initRecognition() {
      if (!SpeechRecognition) return null;
      const r = new SpeechRecognition();
      r.continuous      = true;
      r.interimResults  = true;
      r.maxAlternatives = 1;
      r.lang            = swapWordsCb.checked ? "ja-JP" : "en-US";

      r.onresult = (e) => {
        if (voiceAnswered) return;
        let interim = "";
        let final   = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) final += t;
          else interim += t;
        }
        voiceInterim.textContent = interim || final;

        if (final) {
          handleVoiceResult(final.trim());
        }
      };

      r.onerror = (e) => {
        if (e.error === "no-speech" || e.error === "aborted") return;
        voiceStatus.textContent = `マイクエラー: ${e.error}`;
      };

      r.onend = () => {
        if (voiceMode && !isPaused && !userInput.disabled) {
          voiceRestartTimer = setTimeout(() => {
            try { recognition.start(); } catch(_) {}
          }, 200);
        }
      };

      return r;
    }

    function normalizeText(str) {
      return str.toLowerCase().replace(/[.,!?'"、。！？「」『』\s]/g, "").trim();
    }

    function handleVoiceResult(spokenText) {
      if (!currentWordTarget || voiceAnswered) return;

      const spoken  = normalizeText(spokenText);
      const target  = normalizeText(currentWordTarget);

      voiceInterim.textContent = spokenText; 

      if (spoken === target) {
        voiceAnswered = true;
        showVoiceFlash("⭕", "#27ae60");
        currentTypedLength = currentWordTarget.length;
        updateWordDisplay();

        if (remainingQuestions.length === 0) {
          clearInterval(timerInterval);
          endTime = Date.now();
        }

        setTimeout(() => {
          voiceInterim.textContent = "";
          voiceFlash.textContent   = "";
          setNextQuestion();
        }, 700);
      } else {
        showVoiceFlash("❌", "#e74c3c");
        setTimeout(() => {
          voiceFlash.textContent   = "";
          voiceInterim.textContent = "";
        }, 600);
      }
    }

    function showVoiceFlash(symbol, color) {
      voiceFlash.textContent   = symbol;
      voiceFlash.style.color   = color;
      voiceFlash.style.opacity = "1";
    }

    voiceBtn.addEventListener("click", () => {
      if (!SpeechRecognition) {
        alert("このブラウザは音声認識に対応していません。\nChrome または Edge をご利用ください。");
        return;
      }
      voiceMode = !voiceMode;
      if (voiceMode) {
        startVoice();
      } else {
        stopVoice();
      }
    });

    function startVoice() {
      voiceMode = true;
      recognition = initRecognition();
      voiceBtn.textContent = "🔴 音声入力 ON（クリックで停止）";
      voiceBtn.classList.add("listening");
      voiceStatus.textContent = "マイクで答えを話してください";
      userInput.classList.add("voice-mode");
      userInput.placeholder = "（音声入力中 — キーボードも使えます）";
      try { recognition.start(); } catch(_) {}
    }

    function stopVoice() {
      voiceMode = false;
      clearTimeout(voiceRestartTimer);
      if (recognition) {
        recognition.onend = null; 
        try { recognition.stop(); } catch(_) {}
        recognition = null;
      }
      voiceBtn.textContent = "🎤 音声入力 OFF";
      voiceBtn.classList.remove("listening");
      voiceStatus.textContent  = "";
      voiceInterim.textContent = "";
      voiceFlash.textContent   = "";
      userInput.classList.remove("voice-mode");
      userInput.placeholder    = "ここに入力...";
    }

    swapWordsCb.addEventListener("change", () => {
      if (voiceMode && recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(_) {}
        recognition = initRecognition();
        try { recognition.start(); } catch(_) {}
      }
      if (currentQuestion) setupCurrentQuestionDisplay();
    });

    // ==============================
    // CSV読み込み
    // ==============================
    async function loadQuestionsFromCSV() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error("ネットワークエラー");
        const csvText = await response.text();
        parseCSV(csvText);
        buildUnitSectionOptions();
        startBtn.disabled    = false;
        toggleListBtn.disabled = false;
        voiceBtn.disabled    = false;
        startBtn.textContent = "ゲームスタート";
        messageEl.textContent = "単語リストの読み込みが完了しました！";
        messageEl.style.color = "#27ae60";
        setTimeout(() => {
          if (messageEl.textContent === "単語リストの読み込みが完了しました！") messageEl.textContent = "";
        }, 3000);
      } catch (error) {
        console.error("CSV読み込み失敗:", error);
        messageEl.textContent = "データの読み込みに失敗しました。URLを確認してください。";
        messageEl.style.color = "#e74c3c";
        startBtn.textContent  = "エラー発生";
      }
    }

    function parseCSV(str) {
      const lines = str.split('\n');
      questions = [];
      for (let i = 0; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        let row = [], current = '', inQuotes = false;
        for (let j = 0; j < lines[i].length; j++) {
          let char = lines[i][j];
          if (char === '"' && lines[i][j+1] === '"') { current += '"'; j++; }
          else if (char === '"') { inQuotes = !inQuotes; }
          else if (char === ',' && !inQuotes) { row.push(current); current = ''; }
          else { current += char; }
        }
        row.push(current);
        row = row.map(s => s.trim());
        let id = row[0], display = row[1], target = row[2];
        if (!id || id.toUpperCase() === "ID" || !display || !target) continue;
        questions.push({ id, display, target });
      }
    }

    function buildUnitSectionOptions() {
      unitSectionMap = {};
      questions.forEach(q => {
        const m = q.id.match(/^h3(\d)(\d)/i);
        if (!m) return;
        const unit = m[1], section = m[2];
        if (!unitSectionMap[unit]) unitSectionMap[unit] = new Set();
        unitSectionMap[unit].add(section);
      });
      const units = Object.keys(unitSectionMap).sort((a,b) => Number(a)-Number(b));
      unitSelect.innerHTML = "";
      units.forEach(u => {
        const opt = document.createElement("option");
        opt.value = u; opt.textContent = `3年 ユニット${u}`;
        unitSelect.appendChild(opt);
      });
      const optAll = document.createElement("option");
      optAll.value = "all"; optAll.textContent = "すべて出題";
      unitSelect.appendChild(optAll);
      const optCustom = document.createElement("option");
      optCustom.value = "custom"; optCustom.textContent = "IDで細かく指定する";
      unitSelect.appendChild(optCustom);
      updateSectionOptions();
    }

    function updateSectionOptions() {
      const unit = unitSelect.value;
      const prev = sectionSelect.value;
      sectionSelect.innerHTML = "";
      const optAll = document.createElement("option");
      optAll.value = "all"; optAll.textContent = "すべてのセクション";
      sectionSelect.appendChild(optAll);
      if (unitSectionMap[unit]) {
        const sections = Array.from(unitSectionMap[unit]).sort((a,b) => Number(a)-Number(b));
        sections.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s; opt.textContent = `セクション ${s}`;
          sectionSelect.appendChild(opt);
        });
        if (sections.includes(prev)) sectionSelect.value = prev;
      }
    }

    loadQuestionsFromCSV();

    function getCurrentRangeValue() {
      const unit = unitSelect.value;
      if (unit === "all") return "all";
      if (unit === "custom") return "custom";
      const sec = sectionSelect.value;
      return sec === "all" ? `h3${unit}` : `h3${unit}${sec}`;
    }

    function updateUI() {
      const unit = unitSelect.value;
      if (unit === "all") {
        customRangeDiv.style.display = "none";
        sectionSelect.disabled = true;
      } else if (unit === "custom") {
        customRangeDiv.style.display = "block";
        sectionSelect.disabled = true;
      } else {
        customRangeDiv.style.display = "none";
        sectionSelect.disabled = false;
      }
      const range = getCurrentRangeValue();
      if (range === "custom") {
        bestTimeEl.textContent = "自己ベスト: (カスタム範囲は記録されません)";
      } else {
        const record = localStorage.getItem("typing_record_" + range);
        bestTimeEl.textContent = record ? `自己ベスト: ${record}秒` : "自己ベスト: 記録なし";
      }
    }

    // ==============================
    // 状態の完全リセット（やめる時や設定変更時）
    // ==============================
    function resetGameToInitialState() {
      isPaused = false;
      pausedElapsedMs = 0;
      clearInterval(timerInterval);

      initialSessionQuestions = [];
      remainingQuestions = [];
      currentQuestion = null;
      currentWordTarget = "";
      
      displayEl.textContent  = "ここに問題が表示されます";
      typedEl.textContent    = "";
      untypedEl.textContent  = "";
      progressEl.textContent = "問題: - / -";
      timerEl.textContent    = "タイム: 0.0秒";
      hintText.style.display = "none";
      
      userInput.value        = "";
      userInput.disabled     = true;
      hintBtn.disabled       = true;
      
      stopBtn.disabled       = true;
      startBtn.disabled      = false;
      startBtn.textContent   = "ゲームスタート";
      toggleListBtn.disabled = false;

      mainBtnGroup.style.display = "flex";
      pauseBtnGroup.style.display = "none";

      if (voiceMode && recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(_) {}
      }
      voiceInterim.textContent = "";
      voiceStatus.textContent = "";
    }

    unitSelect.addEventListener("change", () => { resetGameToInitialState(); updateSectionOptions(); updateUI(); });
    sectionSelect.addEventListener("change", () => { resetGameToInitialState(); updateUI(); });
    showUntypedCb.addEventListener("change", updateWordDisplay);

    // ==============================
    // 単語一覧（選択された範囲のみ表示）
    // ==============================
    toggleListBtn.addEventListener("click", () => {
      if (wordListContainer.style.display === "block") {
        wordListContainer.style.display = "none";
        gameArea.style.display = "block";
        toggleListBtn.textContent = "📖 単語一覧を見る";
      } else {
        generateWordList();
        wordListContainer.style.display = "block";
        gameArea.style.display = "none";
        toggleListBtn.textContent = "✖ 一覧を閉じてゲームに戻る";
      }
    });

    function generateWordList() {
      if (questions.length === 0) {
        wordListContainer.innerHTML = "<p>データがありません。</p>";
        return;
      }

      // 出題範囲に応じて表示する単語を絞り込む
      const selectedRange = getCurrentRangeValue();
      let filteredQuestions = [];

      if (selectedRange === "all") {
        filteredQuestions = [...questions];
      } else if (selectedRange === "custom") {
        const s = document.getElementById("start-id").value;
        const e = document.getElementById("end-id").value;
        filteredQuestions = questions.filter(q => q.id >= s && q.id <= e);
      } else {
        filteredQuestions = questions.filter(q => q.id.startsWith(selectedRange));
      }

      if (filteredQuestions.length === 0) {
        wordListContainer.innerHTML = "<p>選択された範囲に単語がありません。</p>";
        return;
      }

      const grouped = {};
      filteredQuestions.forEach(q => {
        let prefix = q.id.substring(0, 4);
        if (!/^h3\d\d$/.test(prefix)) prefix = "other";
        if (!grouped[prefix]) grouped[prefix] = [];
        grouped[prefix].push(q);
      });

      let html = "<h2>選択範囲の単語一覧</h2>";
      Object.keys(grouped).sort().forEach(key => {
        let title = "その他・カスタムID";
        if (key !== "other" && key.length === 4) {
          title = `3年 ユニット${key.charAt(2)} セクション${key.charAt(3)}`;
        }
        html += `<h3>${title}</h3><table class="word-table"><tr><th>英語</th><th>日本語</th></tr>`;
        grouped[key].forEach(q => { html += `<tr><td>${q.target}</td><td>${q.display}</td></tr>`; });
        html += `</table>`;
      });
      wordListContainer.innerHTML = html;
    }

    // ==============================
    // ヒント
    // ==============================
    document.addEventListener("keydown", (e) => {
      if (e.key === " " && userInput && !userInput.disabled && !voiceMode) {
        if (currentWordTarget[currentTypedLength] !== " ") {
          e.preventDefault();
          showHint();
        }
      }
    });

    hintBtn.addEventListener("click", () => {
      showHint();
      if (!userInput.disabled) userInput.focus();
    });

    function showHint() {
      if (!currentWordTarget || currentTypedLength >= currentWordTarget.length) return;
      if (hintCount < currentWordTarget.length - currentTypedLength) { hintCount++; updateWordDisplay(); }
    }

    // ==============================
    // ゲームスタート
    // ==============================
    startBtn.addEventListener("click", () => {
      if (questions.length === 0) { messageEl.textContent = "単語データがありません。"; return; }

      wordListContainer.style.display = "none";
      gameArea.style.display = "block";
      toggleListBtn.textContent = "📖 単語一覧を見る";

      const selectedRange = getCurrentRangeValue();
      if (selectedRange === "all") {
        remainingQuestions = [...questions];
      } else if (selectedRange === "custom") {
        const s = document.getElementById("start-id").value;
        const e = document.getElementById("end-id").value;
        remainingQuestions = questions.filter(q => q.id >= s && q.id <= e);
      } else {
        remainingQuestions = questions.filter(q => q.id.startsWith(selectedRange));
      }

      if (remainingQuestions.length === 0) {
        messageEl.textContent = "指定された範囲に問題がありません。";
        messageEl.style.color = "#e74c3c";
        displayEl.textContent = typedEl.textContent = untypedEl.textContent = "";
        progressEl.textContent = "問題: - / -";
        userInput.disabled = hintBtn.disabled = stopBtn.disabled = true;
        clearInterval(timerInterval);
        timerEl.textContent = "タイム: 0.0秒";
        return;
      }

      initialSessionQuestions = [...remainingQuestions];
      totalQuestionsCount = remainingQuestions.length;

      messageEl.textContent = "タイピング開始！";
      messageEl.style.color = "#e74c3c";
      hintText.style.display = "block";

      startBtn.disabled = true;
      stopBtn.disabled = false;
      toggleListBtn.disabled = true;
      userInput.disabled = false;
      hintBtn.disabled = false;
      userInput.value = "";
      if (!voiceMode) userInput.focus();

      isPaused = false;
      pausedElapsedMs = 0;
      endTime = null;
      clearInterval(timerInterval);
      startTime = Date.now();
      timerInterval = setInterval(() => {
        timerEl.textContent = `タイム: ${((Date.now() - startTime) / 1000).toFixed(1)}秒`;
      }, 100);

      if (voiceMode && recognition) {
        try { recognition.stop(); } catch(_) {}
        setTimeout(() => { try { recognition.start(); } catch(_) {} }, 300);
      } else if (voiceMode) {
        recognition = initRecognition();
        try { recognition.start(); } catch(_) {}
      }

      setNextQuestion();
    });

    // ==============================
    // 中断メニュー
    // ==============================
    stopBtn.addEventListener("click", () => {
      pausedElapsedMs = Date.now() - startTime;
      clearInterval(timerInterval);
      isPaused = true;

      if (voiceMode && recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(_) {}
      }
      voiceInterim.textContent = "";

      mainBtnGroup.style.display = "none";
      pauseBtnGroup.style.display = "flex";

      toggleListBtn.disabled = false;
      userInput.disabled = true;
      hintBtn.disabled = true;

      messageEl.textContent = "中断しました。どうしますか？";
      messageEl.style.color = "#e67e22";
    });

    resumeBtn.addEventListener("click", () => {
      isPaused = false;
      
      mainBtnGroup.style.display = "flex";
      pauseBtnGroup.style.display = "none";

      startBtn.disabled = true;
      stopBtn.disabled = false;
      toggleListBtn.disabled = true;
      userInput.disabled = false;
      hintBtn.disabled = false;
      userInput.value = currentWordTarget ? currentWordTarget.substring(0, currentTypedLength) : "";
      if (!voiceMode) userInput.focus();

      messageEl.textContent = "再開しました！";
      messageEl.style.color = "#e74c3c";

      startTime = Date.now() - pausedElapsedMs;
      endTime = null;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timerEl.textContent = `タイム: ${((Date.now() - startTime) / 1000).toFixed(1)}秒`;
      }, 100);

      if (voiceMode) {
        recognition = initRecognition();
        try { recognition.start(); } catch(_) {}
      }
    });

    restartBtn.addEventListener("click", () => {
      isPaused = false;
      
      mainBtnGroup.style.display = "flex";
      pauseBtnGroup.style.display = "none";

      remainingQuestions = [...initialSessionQuestions];
      totalQuestionsCount = remainingQuestions.length;

      startBtn.disabled = true;
      stopBtn.disabled = false;
      toggleListBtn.disabled = true;
      userInput.disabled = false;
      hintBtn.disabled = false;
      userInput.value = "";
      if (!voiceMode) userInput.focus();

      messageEl.textContent = "最初からやり直します！";
      messageEl.style.color = "#e74c3c";

      pausedElapsedMs = 0;
      endTime = null;
      clearInterval(timerInterval);
      startTime = Date.now();
      timerInterval = setInterval(() => {
        timerEl.textContent = `タイム: ${((Date.now() - startTime) / 1000).toFixed(1)}秒`;
      }, 100);

      if (voiceMode) {
        recognition = initRecognition();
        try { recognition.start(); } catch(_) {}
      }

      setNextQuestion();
    });

    quitBtn.addEventListener("click", () => {
      resetGameToInitialState();
      messageEl.textContent = "ゲームをやめました。";
      messageEl.style.color = "#7f8c8d";
      updateUI(); 
    });

    // ==============================
    // 次の問題
    // ==============================
    function setNextQuestion() {
      voiceAnswered = false;
      voiceInterim.textContent = "";
      voiceFlash.textContent   = "";

      if (remainingQuestions.length === 0) {
        progressEl.textContent = `問題: ${totalQuestionsCount} / ${totalQuestionsCount} (残り: 0単語)`;
        
        if (!endTime) endTime = Date.now();
        const finalTimeStr = ((endTime - startTime) / 1000).toFixed(1);
        const finalTimeNum = parseFloat(finalTimeStr);
        
        const selectedRange = getCurrentRangeValue();
        const guideIsOn     = showUntypedCb.checked;
        let isNewRecord     = false;

        if (selectedRange !== "custom" && !guideIsOn) {
          const saved = localStorage.getItem("typing_record_" + selectedRange);
          if (!saved || finalTimeNum < parseFloat(saved)) {
            localStorage.setItem("typing_record_" + selectedRange, finalTimeStr);
            isNewRecord = true;
          }
        }

        displayEl.textContent = "全問クリア！";
        typedEl.textContent   = "";
        untypedEl.textContent = "";

        if (isNewRecord) {
          messageEl.textContent = `お疲れ様でした！ クリアタイム: ${finalTimeStr}秒 【✨新記録✨】`;
        } else if (guideIsOn) {
          messageEl.textContent = `お疲れ様でした！ クリアタイム: ${finalTimeStr}秒 （ガイド表示中は記録されません）`;
        } else {
          messageEl.textContent = `お疲れ様でした！ クリアタイム: ${finalTimeStr}秒`;
        }
        messageEl.style.color = "#27ae60";

        hintText.style.display = "none";
        currentQuestion = null;
        currentWordTarget = "";
        userInput.value = "";
        userInput.disabled = hintBtn.disabled = true;

        if (voiceMode && recognition) {
          recognition.onend = null;
          try { recognition.stop(); } catch(_) {}
        }
        voiceStatus.textContent = voiceMode ? "ゲーム終了。音声入力OFFにするにはボタンを押してください。" : "";

        isPaused = false;
        pausedElapsedMs = 0;
        startBtn.disabled = false;
        startBtn.textContent = "ゲームスタート";
        stopBtn.disabled = true;
        toggleListBtn.disabled = false;

        updateUI();
        return;
      }

      const currentQNum = totalQuestionsCount - remainingQuestions.length + 1;
      progressEl.textContent = `問題: ${currentQNum} / ${totalQuestionsCount} (残り: ${remainingQuestions.length - 1}単語)`;
      
      if (messageEl.textContent !== "最初からやり直します！") {
        messageEl.style.color = "#e74c3c";
      }

      const idx = Math.floor(Math.random() * remainingQuestions.length);
      currentQuestion = remainingQuestions.splice(idx, 1)[0];
      setupCurrentQuestionDisplay();
    }

    function setupCurrentQuestionDisplay() {
      const isSwapped = swapWordsCb.checked;
      displayEl.textContent = isSwapped ? currentQuestion.target : currentQuestion.display;
      currentWordTarget      = isSwapped ? currentQuestion.display : currentQuestion.target;
      currentTypedLength     = 0;
      hintCount              = 0;
      userInput.value        = "";
      updateWordDisplay();
    }

    function updateWordDisplay() {
      if (!currentWordTarget) return;
      typedEl.textContent = currentWordTarget.substring(0, currentTypedLength);
      if (showUntypedCb.checked) {
        untypedEl.textContent = currentWordTarget.substring(currentTypedLength);
      } else {
        untypedEl.textContent = currentWordTarget.substring(currentTypedLength, currentTypedLength + hintCount);
      }
    }

    // ==============================
    // キーボード入力
    // ==============================
    userInput.addEventListener("compositionstart", () => { isComposing = true; });
    userInput.addEventListener("compositionend",   () => { isComposing = false; handleInputValidation(); });
    userInput.addEventListener("input", () => { if (!isComposing) handleInputValidation(); });

    function handleInputValidation() {
      if (!currentWordTarget || currentTypedLength >= currentWordTarget.length) {
        userInput.value = currentWordTarget ? currentWordTarget.substring(0, currentTypedLength) : "";
        return;
      }
      
      const inputValue = userInput.value;
      
      if (currentWordTarget.toLowerCase().startsWith(inputValue.toLowerCase())) {
        currentTypedLength = inputValue.length;
        hintCount = 0;
        updateWordDisplay();
        
        if (messageEl.textContent.includes("開始") || messageEl.textContent.includes("やり直し")) {
          messageEl.textContent = "";
        }
        
        if (currentTypedLength === currentWordTarget.length) {
          if (remainingQuestions.length === 0) {
            clearInterval(timerInterval);
            endTime = Date.now();
          }
          setTimeout(setNextQuestion, 200);
        }
      } else {
        userInput.value = currentWordTarget.substring(0, currentTypedLength);
      }
    }
  </script>
</body>
</html>
